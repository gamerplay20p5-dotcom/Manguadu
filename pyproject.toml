[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friendhost-pz-bot"
version = "0.1.0"
description = "Bot Discord em Python para servidores Project Zomboid com FriendHost"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9,<4",
    "cryptography>=42,<50",
    "discord.py>=2.5,<3",
    "Pillow>=10,<13",
    "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["manguadu*"]

[tool.pytest.ini_options]
testpaths = ["tests_py"]
